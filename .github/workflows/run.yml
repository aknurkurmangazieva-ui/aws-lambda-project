
name: Python Lambda Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Find Lambda file
        run: |
          echo "Repository contents:"
          ls -la
          echo "Searching for lambda_function.py..."
          find . -type f -name "lambda_function.py"

      - name: Run Lambda function
        run: |
          FILE=$(find . -type f -name "lambda_function.py" -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: lambda_function.py was not found."
            exit 1
          fi
          python -u "$FILE"
