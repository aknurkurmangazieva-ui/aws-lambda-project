
name: run-python

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show project files
        run: ls -la

      - name: Run Lambda function
        run: python -u lambda_function.py
